name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Confirm deployment of the current main commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nimbaos-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

  deploy:
    name: Deploy to mini-PC
    needs: verify
    runs-on: [self-hosted, Windows, X64, nimbaos-production]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out release tools
        uses: actions/checkout@v4

      - name: Deploy verified commit
        shell: powershell
        run: |
          & .\deploy\windows\deploy-production.ps1 `
            -RepositoryPath 'C:\NimbaOS\nimba' `
            -BackupPath 'C:\NimbaOS\backups' `
            -CommitSha $env:GITHUB_SHA
